<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>Éval CM2 — Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-label="Évaluation CM2">
        <span class="brand-icon">◆</span>
        <span>Éval <strong>CM2</strong></span>
      </div>
      <div class="topbar-actions">
        <button id="scores-button" class="text-button" type="button" hidden>Mes scores</button>
        <button id="reset-button" class="text-button" type="button" hidden>Recommencer</button>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <footer class="footer-note">Prototype local • aucune réponse n’est envoyée en ligne</footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
